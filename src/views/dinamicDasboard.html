<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tecknologic - Dynamic Dashboard</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    
  <header class="bg-dark text-white py-3 mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0 fw-bold">Tecknologic &copy; - Inventory Dashboard</h1>
      <a href="../../index.html" class="btn btn-outline-light btn-sm">← Back to Store</a>
    </div>
  </header>

  <main class="container">
    
    <section class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      
      <div class="btn-group" role="group" aria-label="Product Filters">
        <button id="btn-show-all" type="button" class="btn btn-outline-dark active">
          All Products
        </button>
        <button id="btn-show-available" type="button" class="btn btn-outline-success">
          Available Only
        </button>
      </div>

      <span class="badge bg-primary fs-6 px-3 py-2 rounded-pill">
        Loaded Products: <strong id="total-count">0</strong>
      </span>
    </section>

    <section class="card shadow-sm border-0 mb-5">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="text-center">ID</th>
                <th scope="col">Product Name</th>
                <th scope="col">Category</th>
                <th scope="col">Brand</th>
                <th scope="col" class="text-end">Price</th>
                <th scope="col" class="text-center">Stock</th>
                <th scope="col" class="text-center">Availability</th>
              </tr>
            </thead>
            <tbody id="root">
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
  <script src="../controllers/dinamicController.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>
</html>
