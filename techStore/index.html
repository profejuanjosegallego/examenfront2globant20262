<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TechStore - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>💻 TechStore - Inventario de Productos</h2>
        <nav>
            <a href="#" style="color: white; margin-right: 15px;">Inicio</a>
            <a href="#zona-tabla" style="color: white;">Catálogo</a>
        </nav>
    </header>

    <main>
        <section id="info-basica">
            <p>Empresa: TechStore - Venta de tecnología y periféricos.</p>
            <p>Total de productos en sistema: <span id="span-contador">0</span></p>
            
            <button id="btn-cargar">Cargar Catálogo de Productos</button>
        </section>

        <section id="zona-tabla">
            <table id="tabla-productos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Marca</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                   
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Estudiante: Daniel | Cesde</p>
        <p>Año: 2026 | Grupo Dual</p>
    </footer>

    <script src="data/productos.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
