<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore | Carrito</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/carrito.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape--a"></div>
    <div class="bg-shape bg-shape--b"></div>

    <header class="container py-4">
      <div class="purchase-hero card border-0 shadow-sm">
        <div
          class="d-flex flex-wrap justify-content-between align-items-center gap-3"
        >
          <div class="brand-lockup brand-lockup--compact">
            <span class="brand-lockup__icon" aria-hidden="true">TS</span>
            <div>
              <p class="hero__tag m-0">TechStore</p>
              <h1 class="h3 m-0">Carrito de compras</h1>
            </div>
          </div>
          <div class="d-flex gap-2">
            <a
              href="./index.html"
              class="purchase-button purchase-button--secondary"
              >Seguir comprando</a
            >
          </div>
        </div>
        <p class="purchase-hero__subtitle mb-0">
          Revisa tus productos, ajusta cantidades y finaliza tu pedido con una
          interfaz mas clara y visual.
        </p>
      </div>
    </header>

    <main class="container pb-5">
      <div
        id="cartStatus"
        class="alert alert-info"
        role="status"
        aria-live="polite"
      >
        Cargando carrito...
      </div>

      <div class="row g-4">
        <section class="col-12 col-lg-8">
          <div id="cartItems" class="vstack gap-3"></div>
        </section>

        <aside class="col-12 col-lg-4">
          <div
            id="cartSummaryPanel"
            class="card border-0 shadow-sm p-3 sticky-summary"
          >
            <h2 class="h5">Resumen</h2>
            <ul class="summary-list">
              <li><span>Items:</span> <strong id="summaryCount">0</strong></li>
              <li>
                <span>Subtotal:</span> <strong id="summarySubtotal">$0</strong>
              </li>
              <li>
                <span>Envio estimado:</span>
                <strong id="summaryShipping">$0</strong>
              </li>
              <li><span>Total:</span> <strong id="summaryTotal">$0</strong></li>
            </ul>
            <div class="d-grid gap-2 mt-2">
              <button
                id="clearCartButton"
                type="button"
                class="purchase-button purchase-button--danger"
              >
                Vaciar carrito
              </button>
              <button
                id="checkoutButton"
                type="button"
                class="purchase-button purchase-button--primary"
              >
                Finalizar compra
              </button>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <script type="module" src="../js/carrito.js"></script>
  </body>
</html>
