<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechStore | Compra</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/compra.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape--a"></div>
    <div class="bg-shape bg-shape--b"></div>

    <header class="container py-4">
      <div class="purchase-hero">
        <div
          class="d-flex flex-wrap gap-3 justify-content-between align-items-center"
        >
          <div class="brand-lockup brand-lockup--compact">
            <span class="brand-lockup__icon" aria-hidden="true">TS</span>
            <div>
              <p class="hero__tag m-0">TechStore</p>
              <h1 class="h3 m-0">Vista de compra</h1>
            </div>
          </div>
          <div class="d-flex gap-2 align-items-center purchase-nav">
            <a
              href="./index.html"
              class="purchase-button purchase-button--secondary"
              >Volver al catalogo</a
            >
            <a
              href="./carrito.html"
              class="purchase-button purchase-button--secondary cart-link"
              >Carrito
              <span id="cartCountBadge" class="cart-count-badge">0</span></a
            >
          </div>
        </div>
        <p class="purchase-hero__subtitle mb-0">
          Completa tus datos para reservar y finalizar tu compra con una
          experiencia mas cercana a un ecommerce real.
        </p>
      </div>
    </header>

    <main class="container pb-5">
      <div
        id="purchaseStatus"
        class="alert alert-info"
        role="status"
        aria-live="polite"
      >
        Cargando producto...
      </div>

      <div class="row g-4">
        <section class="col-12 col-lg-6">
          <article
            id="purchaseProductCard"
            class="card border-0 shadow-sm h-100"
          ></article>
        </section>

        <section class="col-12 col-lg-6">
          <form
            id="purchaseForm"
            class="card border-0 shadow-sm p-3 p-md-4"
            novalidate
          >
            <h2 class="h5 mb-3">Datos de compra</h2>

            <div class="mb-3">
              <label for="buyerName" class="form-label">Nombre completo</label>
              <input
                id="buyerName"
                name="buyerName"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label for="buyerEmail" class="form-label"
                >Correo electronico</label
              >
              <input
                id="buyerEmail"
                name="buyerEmail"
                type="email"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label for="buyerPhone" class="form-label">Telefono</label>
              <input
                id="buyerPhone"
                name="buyerPhone"
                type="tel"
                class="form-control"
                placeholder="3001234567"
                required
              />
            </div>

            <div class="mb-3">
              <label for="buyerAddress" class="form-label"
                >Direccion de entrega</label
              >
              <input
                id="buyerAddress"
                name="buyerAddress"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label for="buyerCity" class="form-label">Ciudad</label>
              <input
                id="buyerCity"
                name="buyerCity"
                type="text"
                class="form-control"
                required
              />
            </div>

            <div class="mb-3">
              <label for="quantity" class="form-label">Cantidad</label>
              <input
                id="quantity"
                name="quantity"
                type="number"
                class="form-control"
                min="1"
                step="1"
                value="1"
                required
              />
              <div id="stockHelp" class="form-text"></div>
            </div>

            <div class="mb-3">
              <label for="paymentMethod" class="form-label"
                >Metodo de pago</label
              >
              <select
                id="paymentMethod"
                name="paymentMethod"
                class="form-select"
                required
              >
                <option value="">Selecciona...</option>
                <option value="tarjeta">Tarjeta</option>
                <option value="pse">PSE</option>
                <option value="transferencia">Transferencia</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="shippingMethod" class="form-label"
                >Tipo de envio</label
              >
              <select
                id="shippingMethod"
                name="shippingMethod"
                class="form-select"
                required
              >
                <option value="estandar">Estandar (2-5 dias)</option>
                <option value="express">Express (24 horas)</option>
                <option value="retiro">Retiro en tienda</option>
              </select>
            </div>

            <div class="purchase-total p-3 rounded-3 mb-3">
              <p class="m-0 text-secondary">Resumen de compra</p>
              <ul class="summary-list mt-2 mb-2">
                <li>
                  <span>Subtotal:</span>
                  <strong id="purchaseSubtotal">$0</strong>
                </li>
                <li>
                  <span>Envio:</span> <strong id="purchaseShipping">$0</strong>
                </li>
              </ul>
              <p class="h4 m-0 fw-bold">
                Total: <span id="purchaseTotal">$0</span>
              </p>
            </div>

            <div class="d-grid gap-2">
              <button
                type="button"
                id="addToCartButton"
                class="purchase-button purchase-button--primary"
              >
                Agregar al carrito
              </button>
              <button
                type="button"
                id="saveDraftButton"
                class="purchase-button purchase-button--secondary"
              >
                Guardar borrador
              </button>
              <button
                type="submit"
                class="purchase-button purchase-button--primary"
              >
                Confirmar compra
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="../js/compra.js"></script>
  </body>
</html>
